<div style="max-width:650px; margin:40px auto; padding:24px; border:1px solid #ddd; border-radius:12px; background:#fff;">
    <h2 style="margin-top:0;">Find a Store</h2>
    <div style="display:flex; gap:12px;">
        <input id="regionInput" type="text" placeholder="Try: London, Nairobi, Delhi" style="flex:1; padding:12px; border:1px solid #ccc; border-radius:6px;"/>
        <button id="searchBtn" style="padding:12px 24px; background:#0066cc; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Search</button>
    </div>
    <div id="storeResults" style="margin-top:20px;"></div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function(){
        const btn=document.getElementById('searchBtn'), input=document.getElementById('regionInput'), results=document.getElementById('storeResults');
        if(!btn) return;
        const doSearch=()=>{
            const region=input.value.trim();
            if(!region){results.innerHTML='<p style=color:red>Please enter location</p>'; return;}
            results.innerHTML='<p>Searching...</p>';
            fetch('/bin/itransparity/stores?region='+encodeURIComponent(region))
                .then(r=>r.json()).then(data=>{
                if(data.length===0){results.innerHTML='<p><b>No dealerships found</b> for "'+region+'"</p>';}
                else{let h='<ul style=list-style:none;padding:0>'; data.forEach(s=>{h+='<li style=border-bottom:1px solid #eee;padding:12px 0><b>'+s.name+'</b><br><small style=color:#666>'+s.address+'</small></li>';}); h+='</ul>'; results.innerHTML=h;}
            }).catch(()=>{results.innerHTML='<p style=color:red>Error fetching stores</p>';});
        };
        btn.addEventListener('click', doSearch);
        input.addEventListener('keypress', e=>{ if(e.key==='Enter') doSearch(); });
    });
</script>
